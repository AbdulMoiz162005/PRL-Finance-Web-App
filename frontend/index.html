<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/prl-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakistan Refinery Limited · Finance System</title>
    <script>
      (function () {
        var t = localStorage.getItem('rf_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(1200px 600px at 50% -10%, #273475 0%, #1a234d 45%, #12173a 100%);
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-splash.boot-leave {
        opacity: 0;
        visibility: hidden;
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .boot-logo {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 18px 40px -12px rgba(0, 0, 0, 0.5);
        animation: boot-pop 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-logo img {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }
      .boot-ring {
        position: absolute;
        width: 104px;
        height: 104px;
        border-radius: 9999px;
        border: 2px solid transparent;
        border-top-color: #8fa4e1;
        animation: boot-spin 1s linear infinite;
      }
      .boot-title {
        margin-top: 22px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        animation: boot-fade 0.8s 0.15s ease both;
      }
      .boot-sub {
        margin-top: 4px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8fa4e1;
        animation: boot-fade 0.8s 0.25s ease both;
      }
      .boot-bar {
        margin-top: 26px;
        width: 180px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        animation: boot-fade 0.8s 0.35s ease both;
      }
      .boot-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #5f7bd0, #8fa4e1);
        animation: boot-load 1.1s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-pop {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes boot-fade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-load {
        0% { transform: translateX(-120%); }
        50% { transform: translateX(150%); }
        100% { transform: translateX(-120%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-ring,
        #boot-splash .boot-bar-fill { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-inner">
        <div class="boot-logo"><img src="/prl-logo.png" alt="PRL logo" /></div>
        <div class="boot-ring"></div>
        <p class="boot-title">Pakistan Refinery Limited</p>
        <p class="boot-sub">Finance System</p>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
