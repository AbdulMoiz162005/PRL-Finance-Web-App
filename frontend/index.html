<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/prl-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakistan Refinery Limited · Finance System</title>
    <script>
      (function () {
        var t = localStorage.getItem('rf_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1e;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-splash.boot-leave {
        opacity: 0;
        visibility: hidden;
      }
      .boot-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(70px);
        opacity: 0.5;
        animation: orb-drift 9s ease-in-out infinite alternate;
      }
      .boot-orb-a {
        width: 420px;
        height: 420px;
        left: -80px;
        top: -120px;
        background: radial-gradient(circle at 30% 30%, #6366f1, transparent 70%);
      }
      .boot-orb-b {
        width: 380px;
        height: 380px;
        right: -60px;
        bottom: -140px;
        background: radial-gradient(circle at 60% 40%, #0b74b8, transparent 70%);
        animation-delay: -4s;
      }
      .boot-orb-c {
        width: 260px;
        height: 260px;
        right: 24%;
        top: -80px;
        background: radial-gradient(circle at 50% 50%, #8b5cf6, transparent 70%);
        animation-delay: -2s;
      }
      @keyframes orb-drift {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(40px, 30px) scale(1.15); }
      }
      .boot-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .boot-mark {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-logo {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2), 0 18px 40px -10px rgba(0, 0, 0, 0.6);
        animation: mark-breathe 2.4s ease-in-out infinite;
      }
      .boot-logo img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }
      .boot-ring {
        position: absolute;
        inset: -14px;
        border-radius: 9999px;
        background: conic-gradient(from 0deg, transparent 0deg, #5f7bd0 140deg, #8fa4e1 200deg, #0b74b8 300deg, transparent 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
        animation: spin-cw 1.1s linear infinite;
      }
      .boot-ring-rev {
        inset: -22px;
        opacity: 0.45;
        background: conic-gradient(from 180deg, transparent 0deg, #8fa4e1 120deg, transparent 200deg, #6366f1 300deg, transparent 360deg);
        animation: spin-ccw 2.2s linear infinite;
      }
      .boot-halo {
        position: absolute;
        inset: -34px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.35), transparent 70%);
        filter: blur(18px);
        animation: halo-pulse 2.4s ease-in-out infinite;
      }
      @keyframes mark-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.92); }
      }
      @keyframes halo-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes spin-cw {
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        to { transform: rotate(-360deg); }
      }
      .boot-wordmark {
        margin-top: 26px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #e2e8f0, #fff, #e2e8f0);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: wordmark-shine 2.6s linear infinite, boot-fade 0.7s 0.1s ease both;
      }
      @keyframes wordmark-shine {
        to { background-position: 200% center; }
      }
      .boot-sub {
        margin-top: 7px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #64748b;
        animation: boot-fade 0.7s 0.2s ease both;
      }
      .boot-line {
        margin-top: 26px;
        width: 168px;
        height: 2px;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.14);
        overflow: hidden;
        animation: boot-fade 0.7s 0.3s ease both;
      }
      .boot-line-fill {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #8fa4e1, #0b74b8, transparent);
        background-size: 200% 100%;
        animation: line-morph 1.3s ease-in-out infinite;
      }
      @keyframes line-morph {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(220%); }
      }
      @keyframes boot-fade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-orb,
        #boot-splash .boot-ring,
        #boot-splash .boot-ring-rev,
        #boot-splash .boot-logo,
        #boot-splash .boot-halo,
        #boot-splash .boot-line-fill,
        #boot-splash .boot-wordmark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-orb boot-orb-a"></div>
      <div class="boot-orb boot-orb-b"></div>
      <div class="boot-orb boot-orb-c"></div>
      <div class="boot-stage">
        <div class="boot-mark">
          <div class="boot-halo"></div>
          <div class="boot-ring"></div>
          <div class="boot-ring boot-ring-rev"></div>
          <div class="boot-logo"><img src="/prl-logo.png" alt="PRL logo" /></div>
        </div>
        <p class="boot-wordmark">PRL Finance</p>
        <p class="boot-sub">Enterprise Finance System</p>
        <div class="boot-line"><div class="boot-line-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
